<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f0e3"><title>Sin conexión — La Clave"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="m3-system.css"></head><body><main class="offline-page" aria-labelledby="offline-title"><span class="eyebrow">LA CLAVE</span><h1 id="offline-title">Estás sin conexión</h1><p>Esta pantalla no necesita internet. Cuando vuelvas a conectarte podrás continuar con tus lecciones y laboratorios.</p><div class="offline-actions"><button class="primary-button" onclick="location.reload()">Reintentar conexión</button><a class="secondary-button" href="routes.html">Ir a rutas guardadas</a></div></main><style>.offline-page{min-height:100svh;display:grid;place-content:center;gap:16px;max-width:560px;margin:auto;padding:24px}.offline-page h1{margin:0;font:700 clamp(2.2rem,8vw,4rem)/1.05 var(--serif)}.offline-page p{font-size:1.125rem;line-height:1.6;color:var(--muted)}.offline-actions{display:flex;flex-wrap:wrap;gap:12px}.offline-actions>*{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:999px;text-decoration:none}.offline-actions .secondary-button{border:1px solid var(--outline);color:var(--on-surface)}@media(max-width:520px){.offline-actions>*{width:100%}}</style></body></html>
